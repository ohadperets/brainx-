name: Firestore rules tests

# Runs the security-rules tests in the Firebase Emulator (no cloud project, no cost).
# Triggered on every push and pull request; never deploys anything.
on:
  push:
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rules: [firestore.rules, firestore.final.rules]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install test tools
        run: npm install --no-audit --no-fund
      - name: Smoke test
        run: node tools/smoke.mjs
      - name: Rules tests (${{ matrix.rules }})
        env:
          RULES_FILE: ${{ matrix.rules }}
        run: npx firebase emulators:exec --only firestore --project demo-brainx "node --test tests/"
